```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>도형 복원 연구소</title>
  <style>
    :root {
      --bg: #061b1c;
      --panel: #0b292a;
      --panel-light: #103536;
      --line: #2d6868;
      --primary: #55e0cf;
      --primary-dark: #1ba99b;
      --text: #ecfffc;
      --muted: #a5cfca;
      --success: #65e78e;
      --warning: #ffd166;
      --danger: #ff7b7b;
      --shape-fill: rgba(85, 224, 207, 0.13);
      --shape-stroke: #63ead9;
      --point: #ffe28a;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 0%, rgba(42, 121, 119, 0.22), transparent 35%),
        linear-gradient(145deg, #041314, var(--bg));
      color: var(--text);
      font-family:
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      padding: 18px;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(99, 234, 217, 0.2);
      border-radius: 18px;
      background: rgba(7, 31, 32, 0.92);
      box-shadow: var(--shadow);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: -0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .score-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .score-box {
      min-width: 96px;
      padding: 10px 12px;
      border: 1px solid rgba(85, 224, 207, 0.24);
      border-radius: 12px;
      background: rgba(16, 53, 54, 0.92);
      text-align: center;
    }

    .score-box span {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .score-box strong {
      display: block;
      margin-top: 2px;
      color: var(--primary);
      font-size: 1.15rem;
    }

    .score-box.timer-warning {
      border-color: var(--warning);
      background: rgba(103, 76, 18, 0.4);
    }

    .score-box.timer-warning strong {
      color: var(--warning);
    }

    .score-box.timer-danger {
      border-color: var(--danger);
      background: rgba(112, 35, 35, 0.42);
      animation: timerPulse 1s steps(1, end) infinite;
    }

    .score-box.timer-danger strong {
      color: var(--danger);
    }

    @keyframes timerPulse {
      0%,
      49% {
        transform: scale(1);
        box-shadow: none;
      }

      50%,
      100% {
        transform: scale(1.04);
        box-shadow: 0 0 20px rgba(255, 123, 123, 0.35);
      }
    }

    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .stage-btn,
    .action-btn {
      border: 1px solid rgba(99, 234, 217, 0.28);
      border-radius: 12px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      transition:
        border-color 0.16s ease,
        background 0.16s ease,
        transform 0.16s ease;
    }

    .stage-btn {
      position: relative;
      padding: 12px 10px;
      font-weight: 800;
    }

    .stage-btn:hover,
    .action-btn:hover {
      border-color: var(--primary);
      background: var(--panel-light);
    }

    .stage-btn:active,
    .action-btn:active {
      transform: translateY(1px);
    }

    .stage-btn.active {
      border-color: var(--primary);
      color: #031b1a;
      background: linear-gradient(135deg, #69eadb, #34c8b8);
    }

    .stage-btn.completed::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 8px;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      color: #05251e;
      background: var(--success);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.82fr);
      gap: 16px;
      align-items: stretch;
    }

    .workspace-card,
    .mission-card,
    .bottom-panel {
      border: 1px solid rgba(99, 234, 217, 0.2);
      border-radius: 18px;
      background: rgba(7, 31, 32, 0.94);
      box-shadow: var(--shadow);
    }

    .workspace-card {
      position: relative;
      min-height: 560px;
      overflow: hidden;
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(99, 234, 217, 0.15);
    }

    .workspace-header strong {
      font-size: 1rem;
    }

    .workspace-header span {
      color: var(--muted);
      font-size: 0.84rem;
      text-align: right;
    }

    .svg-wrap {
      position: relative;
      min-height: 505px;
      background:
        linear-gradient(rgba(85, 224, 207, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85, 224, 207, 0.045) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(20, 86, 84, 0.22), transparent 62%);
      background-size: 30px 30px, 30px 30px, auto;
      touch-action: none;
      user-select: none;
    }

    #geometrySvg {
      display: block;
      width: 100%;
      min-height: 505px;
      touch-action: none;
    }

    .mission-card {
      padding: 18px;
    }

    .stage-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--primary);
      background: rgba(85, 224, 207, 0.1);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .mission-card h2 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.3;
      letter-spacing: -0.04em;
    }

    .learning-goal {
      margin: 10px 0 16px;
      padding: 11px 12px;
      border-left: 3px solid var(--primary-dark);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(16, 53, 54, 0.66);
      font-size: 0.91rem;
      line-height: 1.55;
    }

    .section-title {
      margin: 17px 0 9px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .condition-list {
      display: grid;
      gap: 8px;
    }

    .condition-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: center;
      min-height: 48px;
      padding: 9px 10px;
      border: 1px solid rgba(165, 207, 202, 0.15);
      border-radius: 11px;
      color: var(--muted);
      background: rgba(9, 40, 41, 0.8);
      line-height: 1.35;
    }

    .condition-item.pass {
      border-color: rgba(101, 231, 142, 0.62);
      color: var(--text);
      background: rgba(34, 104, 67, 0.24);
    }

    .condition-item.near {
      border-color: rgba(255, 209, 102, 0.48);
      background: rgba(100, 76, 20, 0.18);
    }

    .condition-icon {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid rgba(165, 207, 202, 0.35);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 900;
    }

    .condition-item.pass .condition-icon {
      border-color: var(--success);
      color: #062218;
      background: var(--success);
    }

    .stage-score {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(16, 53, 54, 0.74);
    }

    .stage-score span {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .stage-score strong {
      color: var(--warning);
      font-size: 1.18rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }

    .action-btn {
      min-height: 46px;
      padding: 10px 12px;
      font-weight: 800;
    }

    .action-btn.primary {
      grid-column: 1 / -1;
      border-color: transparent;
      color: #032522;
      background: linear-gradient(135deg, #67e9da, #31c0b1);
    }

    .action-btn.danger {
      border-color: rgba(255, 123, 123, 0.55);
      background: rgba(100, 35, 35, 0.28);
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.46;
      transform: none;
    }

    .hint-text {
      min-height: 54px;
      margin-top: 11px;
      padding: 10px 11px;
      border: 1px dashed rgba(255, 209, 102, 0.45);
      border-radius: 10px;
      color: #ffe6a4;
      background: rgba(113, 83, 18, 0.14);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .bottom-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 14px;
      margin-top: 16px;
      padding: 15px 17px;
    }

    .bottom-label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #feedbackMessage {
      min-height: 45px;
      display: flex;
      align-items: center;
      line-height: 1.5;
    }

    #measurementSummary {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .completion-panel {
      position: absolute;
      z-index: 20;
      top: 18px;
      left: 50%;
      width: min(390px, calc(100% - 30px));
      padding: 16px;
      border: 1px solid rgba(101, 231, 142, 0.7);
      border-radius: 15px;
      background: rgba(5, 42, 32, 0.97);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      transform: translateX(-50%);
    }

    .completion-panel.failure {
      border-color: rgba(255, 123, 123, 0.75);
      background: rgba(58, 18, 21, 0.97);
    }

    .completion-panel[hidden] {
      display: none;
    }

    .completion-panel strong {
      display: block;
      color: var(--success);
      font-size: 1.2rem;
    }

    .completion-panel.failure strong {
      color: var(--danger);
    }

    .completion-panel p {
      margin: 7px 0 12px;
      line-height: 1.45;
    }

    .panel-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .panel-actions button {
      padding: 8px 14px;
      border: 0;
      border-radius: 9px;
      color: #03231c;
      background: var(--success);
      cursor: pointer;
      font-weight: 900;
    }

    .panel-actions button.secondary {
      color: var(--text);
      background: var(--panel-light);
      border: 1px solid rgba(99, 234, 217, 0.28);
    }

    .shape-main {
      fill: var(--shape-fill);
      stroke: var(--shape-stroke);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .shape-main.near {
      filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.38));
    }

    .shape-main.snap-ready {
      filter: drop-shadow(0 0 12px rgba(85, 224, 207, 0.7));
    }

    .shape-side {
      stroke: transparent;
      stroke-width: 12;
      stroke-linecap: round;
      pointer-events: none;
    }

    .shape-side.highlight {
      stroke: rgba(255, 209, 102, 0.8);
    }

    .shape-side.near {
      stroke: rgba(255, 209, 102, 0.4);
    }

    .diagonal-line {
      stroke: rgba(255, 255, 255, 0.48);
      stroke-width: 2;
      stroke-dasharray: 8 7;
      pointer-events: none;
    }

    .guide-line {
      stroke: rgba(255, 209, 102, 0.85);
      stroke-width: 3;
      stroke-dasharray: 10 7;
      pointer-events: none;
    }

    .example-shape {
      fill: rgba(255, 209, 102, 0.045);
      stroke: rgba(255, 209, 102, 0.72);
      stroke-width: 3;
      stroke-dasharray: 11 8;
      pointer-events: none;
    }

    .point-halo {
      fill: transparent;
      cursor: grab;
      pointer-events: all;
      touch-action: none;
    }

    .point-halo.locked {
      cursor: not-allowed;
      pointer-events: none;
    }

    .point-glow {
      fill: rgba(255, 209, 102, 0.14);
      stroke: rgba(255, 209, 102, 0.5);
      stroke-width: 2;
      pointer-events: none;
    }

    .vertex-point {
      fill: var(--point);
      stroke: #5b4313;
      stroke-width: 2;
      pointer-events: none;
    }

    .vertex-label,
    .measure-label {
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #04191a;
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .vertex-label {
      font-size: 14px;
      font-weight: 900;
    }

    .measure-label {
      fill: #d8fffa;
      font-size: 13px;
      font-weight: 800;
    }

    .angle-arc {
      fill: none;
      stroke: rgba(164, 241, 230, 0.76);
      stroke-width: 2;
      pointer-events: none;
    }

    .angle-arc.highlight {
      stroke: var(--warning);
      stroke-width: 6;
    }

    .right-angle {
      fill: none;
      stroke: var(--success);
      stroke-width: 3;
      pointer-events: none;
    }

    .right-angle-hint {
      fill: rgba(255, 209, 102, 0.12);
      stroke: var(--warning);
      stroke-width: 4;
      pointer-events: none;
    }

    .magnet-badge {
      fill: rgba(85, 224, 207, 0.14);
      stroke: var(--primary);
      stroke-width: 2;
      pointer-events: none;
    }

    .magnet-text {
      fill: var(--primary);
      font-size: 22px;
      text-anchor: middle;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .score-area {
        justify-content: flex-start;
      }

      .score-box {
        flex: 1 1 96px;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .workspace-card {
        min-height: auto;
      }

      .svg-wrap,
      #geometrySvg {
        min-height: 430px;
      }

      .bottom-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      .stage-tabs {
        gap: 6px;
      }

      .stage-btn {
        padding: 11px 5px;
        font-size: 0.83rem;
      }

      .workspace-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .workspace-header span {
        text-align: left;
      }

      .mission-card {
        padding: 15px;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }

      .action-btn.primary {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>🔬 도형 복원 연구소</h1>
        <p>꼭짓점을 움직여 손상된 도형의 성질을 복원하세요.</p>
      </div>

      <div class="score-area">
        <div class="score-box">
          <span>현재 Stage</span>
          <strong id="topStage">1</strong>
        </div>
        <div class="score-box">
          <span>문제 번호</span>
          <strong id="problemNumber">1</strong>
        </div>
        <div id="timerBox" class="score-box">
          <span>남은 시간</span>
          <strong id="timeLeft">40초</strong>
        </div>
        <div class="score-box">
          <span>현재 총점</span>
          <strong id="totalScore">0</strong>
        </div>
        <div class="score-box">
          <span>최고 총점</span>
          <strong id="bestScore">0</strong>
        </div>
      </div>
    </header>

    <nav class="stage-tabs" aria-label="단계 선택">
      <button class="stage-btn active" data-stage="1" type="button">Stage 1</button>
      <button class="stage-btn" data-stage="2" type="button">Stage 2</button>
      <button class="stage-btn" data-stage="3" type="button">Stage 3</button>
    </nav>

    <section class="main-grid">
      <article class="workspace-card">
        <div class="workspace-header">
          <strong>도형 조작 작업대</strong>
          <span>노란 꼭짓점을 마우스 또는 손가락으로 드래그하세요.</span>
        </div>

        <div class="svg-wrap">
          <svg
            id="geometrySvg"
            viewBox="0 0 700 500"
            role="img"
            aria-label="도형을 직접 조작하는 작업 공간"
          ></svg>

          <div id="completionPanel" class="completion-panel" hidden>
            <strong id="completionTitle">복원 완료!</strong>
            <p id="completionText"></p>
            <div class="panel-actions">
              <button id="panelRetryBtn" class="secondary" type="button">다시 도전</button>
              <button id="panelNewProblemBtn" type="button">다음 랜덤 문제</button>
              <button id="closeCompletionBtn" class="secondary" type="button">닫기</button>
            </div>
          </div>
        </div>
      </article>

      <aside class="mission-card">
        <div id="stageLabel" class="stage-label">STAGE 1 · 문제 1</div>
        <h2 id="missionTitle">이등변삼각형 복원</h2>
        <div id="learningGoal" class="learning-goal"></div>

        <div class="section-title">실시간 복원 조건</div>
        <div id="conditionList" class="condition-list"></div>

        <div class="stage-score">
          <span>현재 문제 기본 점수</span>
          <strong><span id="stageScore">100</span>점</strong>
        </div>

        <div class="button-grid">
          <button id="hintBtn" class="action-btn" type="button">힌트 보기</button>
          <button id="resetBtn" class="action-btn" type="button">초기화</button>
          <button id="newProblemBtn" class="action-btn" type="button">새 문제</button>
          <button id="nextBtn" class="action-btn primary" type="button">다음 Stage</button>
        </div>

        <div id="hintText" class="hint-text">
          아직 힌트를 사용하지 않았습니다.
        </div>
      </aside>
    </section>

    <section class="bottom-panel">
      <div>
        <div class="bottom-label">실시간 피드백</div>
        <div id="feedbackMessage">꼭짓점을 움직이며 조건 표시가 바뀌는지 확인해 보세요.</div>
      </div>

      <div>
        <div class="bottom-label">현재 측정값</div>
        <div id="measurementSummary"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const SVG_NS = "http://www.w3.org/2000/svg";
    const SVG_BOUNDS = {
      minX: 55,
      maxX: 645,
      minY: 55,
      maxY: 445
    };

    const STORAGE_KEYS = {
      bestScore: "geometryRepairLabBestScore",
      completedStages: "geometryRepairLabCompletedStages"
    };

    const TIME_LIMITS = {
      1: 40,
      2: 50,
      3: 60
    };

    const TOLERANCE = {
      lengthRatio: 0.04,
      angleDegrees: 4,
      parallelCrossRatio: 0.05,
      perpendicularDotRatio: 0.06,
      diagonalRatio: 0.04,
      snapLengthRatio: 0.08,
      snapAngleDegrees: 8,
      snapParallelRatio: 0.1,
      snapPerpendicularRatio: 0.12,
      nearLengthRatio: 0.14,
      nearAngleDegrees: 14,
      nearParallelRatio: 0.18,
      nearPerpendicularRatio: 0.2
    };

    const stageData = {
      1: {
        title: "이등변삼각형 복원",
        goal:
          "두 변의 길이가 같을 때 두 밑각도 같아지는 이등변삼각형의 성질을 확인합니다.",
        labels: ["A", "B", "C"],
        conditions: [
          "두 빗변의 길이가 거의 같다.",
          "두 밑각의 크기가 거의 같다."
        ],
        hints: [
          "꼭짓점 B가 밑변 AC의 수직이등분선 위에 오도록 조절하세요.",
          "밑변의 양 끝에 있는 ∠A와 ∠C가 같아야 합니다.",
          "점선으로 표시된 정답 도형을 참고해 꼭짓점을 이동하세요."
        ]
      },
      2: {

    function calculateDistance(pointA, pointB) {

    function calculateAngle(pointA, vertex, pointC) {
      const vectorA = createVector(vertex, pointA);
      const vectorC = createVector(vertex, pointC);
      const lengthA = vectorLength(vectorA);
      const lengthC = vectorLength(vectorC);

      if (lengthA === 0 || lengthC === 0) {
        return 0;
      }

      let cosine =
        calculateDotProduct(vectorA, vectorC) / (lengthA * lengthC);

      cosine = Math.max(-1, Math.min(1, cosine));
      return Math.acos(cosine) * (180 / Math.PI);

    function createVector(pointA, pointB) {
      return {

    function calculateDotProduct(vectorA, vectorB) {
      return vectorA.x * vectorB.x + vectorA.y * vectorB.y;

      const lengthA = vectorLength(vectorA);

      if (lengthA === 0 || lengthB === 0) {
        return false;
      }

      const normalizedCross =
        Math.abs(calculateCrossProduct(vectorA, vectorB)) /

      return normalizedCross <= Math.sin((toleranceDegrees * Math.PI) / 180);

    function orientation(pointA, pointB, pointC) {
      const value =
        (pointB.y - pointA.y) * (pointC.x - pointB.x) -
        (pointB.x - pointA.x) * (pointC.y - pointB.y);

      if (Math.abs(value) < 0.0001) {

      return value > 0 ? 1 : 2;

    function getMeasurements(points) {

    function normalizeAngleDifference(first, second) {

          !arePointsInsideBounds(solutionPoints, 6) ||
          minimumPointDistance(solutionPoints) < 80 ||
          polygonArea(solutionPoints) < 9000 ||
          !isStageSolved(solutionPoints, stageNumber)
        ) {
          continue;
        }

        const brokenData = createBrokenInitialPoints(
          solutionPoints,
          stageNumber
        );

        if (
          !isInitialProblemValid(
            brokenData.points,
            solutionPoints,
            stageNumber
          )
        ) {
          continue;
        }

        const features = getProblemFeatures(
          solutionPoints,
          brokenData.brokenIndices,
          stageNumber
        );

        const tooSimilar = Game.recentProblemFeatures[stageNumber].some(
          (recentFeatures) =>
            areProblemFeaturesTooSimilar(features, recentFeatures)
        );

        if (tooSimilar) {
          continue;
        }

        return {
          id:
            "stage-" +
            stageNumber +
            "-" +
            Date.now().toString(36) +
            "-" +
            Math.random().toString(36).slice(2, 8),
          stageNumber,
          solutionPoints: clonePoints(solutionPoints),
          initialPoints: clonePoints(brokenData.points),
          currentPoints: clonePoints(brokenData.points),
          hintCount: 0,
          startTime: Date.now(),
          completed: false,
          features
        };
      }

      const fallback = fallbackProblems[stageNumber];

      return {
        id:
          "stage-" +
          stageNumber +
          "-fallback-" +
          Date.now().toString(36),
        stageNumber,
        solutionPoints: clonePoints(fallback.solutionPoints),
        initialPoints: clonePoints(fallback.initialPoints),
        currentPoints: clonePoints(fallback.initialPoints),
        hintCount: 0,
        startTime: Date.now(),
        completed: false,
        features: {
          ...fallback.features,
          brokenIndices: [...fallback.features.brokenIndices]
        }
      };
    }

    function createExactIsoscelesFromCurrent(points) {
      const baseStart = points[0];
      const apex = points[1];
      const baseEnd = points[2];
      const baseMidpoint = midpoint(baseStart, baseEnd);
      const baseVector = createVector(baseStart, baseEnd);
      const baseLength = vectorLength(baseVector);

      if (baseLength < 80) {
        return null;
      }

      const perpendicular = normalizeVector(perpendicularVector(baseVector));
      const fromMidpoint = createVector(baseMidpoint, apex);
      let signedHeight = calculateDotProduct(fromMidpoint, perpendicular);

      if (Math.abs(signedHeight) < 75) {
        signedHeight = (signedHeight >= 0 ? 1 : -1) * 75;
      }

      const correctedApex = addPoints(
        baseMidpoint,
        scaleVector(perpendicular, signedHeight)
      );

      const result = [
        { ...baseStart },
        clampPoint(correctedApex),
        { ...baseEnd }
      ];

      if (
        !arePointsInsideBounds(result) ||
        polygonArea(result) < 4500 ||
        minimumPointDistance(result) < 55
      ) {
        return null;
      }

      return result;
    }

    function createExactParallelogramFromCurrent(points, draggedIndex) {
      const candidates = [];

      const formulas = [
        {
          correctedIndex: 3,
          point: addPoints(points[0], subtractPoints(points[2], points[1]))
        },
        {
          correctedIndex: 2,
          point: addPoints(points[1], subtractPoints(points[3], points[0]))
        },
        {
          correctedIndex: 1,
          point: addPoints(points[0], subtractPoints(points[2], points[3]))
        },
        {
          correctedIndex: 0,
          point: addPoints(points[1], subtractPoints(points[3], points[2]))
        }
      ];

      formulas.forEach((formula) => {
        if (formula.correctedIndex === draggedIndex) {
          return;
        }

        const candidatePoints = clonePoints(points);
        candidatePoints[formula.correctedIndex] = clampPoint(formula.point);

        if (
          arePointsInsideBounds(candidatePoints) &&
          !isSelfIntersectingPolygon(candidatePoints) &&
          polygonArea(candidatePoints) > 7000 &&
          minimumPointDistance(candidatePoints) > 55
        ) {
          candidates.push({
            points: candidatePoints,
            movement: calculateDistance(
              points[formula.correctedIndex],
              candidatePoints[formula.correctedIndex]
            )
          });
        }
      });

      candidates.sort((first, second) => first.movement - second.movement);

      return candidates.length > 0 ? candidates[0].points : null;
    }

    function createExactRectangleFromCurrent(points) {
      const center = getPolygonCenter(points);

      let firstAxis = createVector(points[0], points[1]);
      let firstLength = vectorLength(firstAxis);

      if (firstLength < 80) {
        firstAxis = createVector(points[3], points[2]);
        firstLength = vectorLength(firstAxis);
      }

      if (firstLength < 80) {
        return null;
      }

      const firstUnit = normalizeVector(firstAxis);
      let secondUnit = normalizeVector(perpendicularVector(firstUnit));

      const approximateSecondDirection = createVector(points[0], points[3]);

      if (calculateDotProduct(secondUnit, approximateSecondDirection) < 0) {
        secondUnit = scaleVector(secondUnit, -1);
      }

      const oppositeFirstLength = calculateDistance(points[3], points[2]);
      const firstHalfLength =
        clamp((firstLength + oppositeFirstLength) / 4, 65, 190);

      const secondLengthA = Math.abs(
        calculateDotProduct(createVector(points[0], points[3]), secondUnit)
      );

      const secondLengthB = Math.abs(
        calculateDotProduct(createVector(points[1], points[2]), secondUnit)
      );

      const secondHalfLength =
        clamp((secondLengthA + secondLengthB) / 4, 55, 145);

      const firstHalf = scaleVector(firstUnit, firstHalfLength);
      const secondHalf = scaleVector(secondUnit, secondHalfLength);

      const result = [
        subtractPoints(subtractPoints(center, firstHalf), secondHalf),
        addPoints(subtractPoints(center, secondHalf), firstHalf),
        addPoints(addPoints(center, firstHalf), secondHalf),
        addPoints(subtractPoints(center, firstHalf), secondHalf)
      ].map(clampPoint);

      if (
        !arePointsInsideBounds(result) ||
        polygonArea(result) < 7000 ||
        minimumPointDistance(result) < 55 ||
        isSelfIntersectingPolygon(result)
      ) {
        return null;
      }

      return result;
    }

    function calculateSnapState(points, stageNumber) {
      const success = evaluateStageConditions(points, stageNumber, "success");
      const snap = evaluateStageConditions(points, stageNumber, "snap");
      const near = evaluateStageConditions(points, stageNumber, "near");

      const snapCoreCount = snap.coreConditions.filter(Boolean).length;
      const nearCoreCount = near.coreConditions.filter(Boolean).length;
      const totalCoreConditions = snap.coreConditions.length;

      return {
        success,
        snap,
        near,
        snapCoreCount,
        nearCoreCount,
        totalCoreConditions,
        isSnapReady:
          snap.validShape && snapCoreCount === totalCoreConditions,
        isNear:
          near.validShape &&
          nearCoreCount >= Math.max(1, totalCoreConditions - 1),
        hasOneNearCondition: nearCoreCount >= 1
      };
    }

    const GeometryEngine = {
      svg: document.getElementById("geometrySvg"),
      points: [],
      labels: [],
      currentStage: 1,
      hintLevel: 0,
      activePointIndex: null,
      activePointerId: null,
      dragStartPoint: null,
      lastDraggedIndex: null,
      isSnapping: false,
      snapAnimationFrame: null,
      proximityState: "far",

      initialize() {
        this.svg.addEventListener("pointermove", (event) => {
          this.handlePointerMove(event);
        });

        this.svg.addEventListener("pointerup", (event) => {
          this.endDrag(event, true);
        });

        this.svg.addEventListener("pointercancel", (event) => {
          this.endDrag(event, false);
        });

        this.svg.addEventListener("pointerleave", (event) => {
          if (event.buttons === 0) {
            this.endDrag(event, true);
          }
        });
      },

      setProblem(problem) {
        this.cancelSnapAnimation();
        this.currentStage = problem.stageNumber;
        this.points = clonePoints(problem.currentPoints);
        this.labels = [...stageData[problem.stageNumber].labels];
        this.hintLevel = problem.hintCount;
        this.activePointIndex = null;
        this.activePointerId = null;
        this.dragStartPoint = null;
        this.lastDraggedIndex = null;
        this.proximityState = "far";
        this.render();
      },

      resetPoints(points) {
        this.cancelSnapAnimation();
        this.points = clonePoints(points);
        this.activePointIndex = null;
        this.activePointerId = null;
        this.dragStartPoint = null;
        this.lastDraggedIndex = null;
        this.proximityState = "far";
        this.render();
      },

      cancelSnapAnimation() {
        if (this.snapAnimationFrame !== null) {
          cancelAnimationFrame(this.snapAnimationFrame);
          this.snapAnimationFrame = null;
        }

        this.isSnapping = false;
      },

      getSvgPoint(event) {
        const svgPoint = this.svg.createSVGPoint();
        svgPoint.x = event.clientX;
        svgPoint.y = event.clientY;

        const matrix = this.svg.getScreenCTM();

        if (!matrix) {
          return { x: 0, y: 0 };
        }

        return clampPoint(
          svgPoint.matrixTransform(matrix.inverse())
        );
      },

      startDrag(event, index) {
        if (
          !Game.isStageActive ||
          Game.isStageCompleted ||
          Game.isTimeOver ||
          this.isSnapping
        ) {
          return;
        }

        event.preventDefault();

        this.activePointIndex = index;
        this.activePointerId = event.pointerId;
        this.dragStartPoint = { ...this.points[index] };
        this.lastDraggedIndex = index;

        try {
          event.currentTarget.setPointerCapture(event.pointerId);
        } catch (error) {
          void error;
        }
      },

      handlePointerMove(event) {
        if (
          this.activePointIndex === null ||
          this.activePointerId !== event.pointerId ||
          this.isSnapping ||
          !Game.isStageActive ||
          Game.isTimeOver ||
          Game.isStageCompleted
        ) {
          return;
        }

        event.preventDefault();

        const point = this.getSvgPoint(event);
        this.points[this.activePointIndex] = point;

        if (
          this.dragStartPoint &&
          calculateDistance(this.dragStartPoint, point) >= 3
        ) {
          Game.hasUserInteracted = true;
        }

        Game.currentProblem.currentPoints = clonePoints(this.points);
        this.updateProximityState();
        this.render();
        Game.evaluateStage(false);
      },

      endDrag(event, attemptSnap) {
        if (
          this.activePointIndex === null ||
          (
            this.activePointerId !== null &&
            event.pointerId !== this.activePointerId
          )
        ) {
          return;
        }

        const draggedIndex = this.activePointIndex;

        this.activePointIndex = null;
        this.activePointerId = null;
        this.dragStartPoint = null;

        if (
          attemptSnap &&
          Game.hasUserInteracted &&
          Game.isStageActive &&
          !Game.isTimeOver &&
          !Game.isStageCompleted
        ) {
          this.attemptSnap(draggedIndex);
        }
      },

      updateProximityState() {
        const snapState = calculateSnapState(
          this.points,
          this.currentStage
        );

        if (snapState.isSnapReady) {
          this.proximityState = "snap";
        } else if (snapState.isNear) {
          this.proximityState = "near";
        } else if (snapState.hasOneNearCondition) {
          this.proximityState = "approaching";
        } else {
          this.proximityState = "far";
        }
      },

      attemptSnap(draggedIndex) {
        if (
          this.isSnapping ||
          Game.isTimeOver ||
          Game.isStageCompleted ||
          !Game.isStageActive
        ) {
          return;
        }

        const snapState = calculateSnapState(
          this.points,
          this.currentStage
        );

        if (!snapState.isSnapReady) {
          Game.evaluateStage(false);
          return;
        }

        let targetPoints = null;

        if (this.currentStage === 1) {
          targetPoints = createExactIsoscelesFromCurrent(this.points);
        } else if (this.currentStage === 2) {
          targetPoints = createExactParallelogramFromCurrent(
            this.points,
            draggedIndex
          );
        } else {
          targetPoints = createExactRectangleFromCurrent(this.points);
        }

        if (!targetPoints || !isStageSolved(targetPoints, this.currentStage)) {
          Game.evaluateStage(false);
          return;
        }

        const movements = targetPoints.map((target, index) =>
          calculateDistance(target, this.points[index])
        );

        const maximumMovement = Math.max(...movements);
        const allowedMovement =
          this.currentStage === 1 ? 44 : 52;

        if (maximumMovement > allowedMovement) {
          Game.evaluateStage(false);
          return;
        }

        this.animateSnap(targetPoints);
      },

      animateSnap(targetPoints) {
        this.cancelSnapAnimation();
        this.isSnapping = true;
        Game.isSnapping = true;

        const startPoints = clonePoints(this.points);
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        const duration = reduceMotion ? 0 : 210;
        const startTime = performance.now();

        const animate = (currentTime) => {
          const rawProgress =
            duration === 0
              ? 1
              : Math.min(1, (currentTime - startTime) / duration);

          const progress =
            1 - Math.pow(1 - rawProgress, 3);

          this.points = startPoints.map((startPoint, index) => ({
            x:
              startPoint.x +
              (targetPoints[index].x - startPoint.x) * progress,
            y:
              startPoint.y +
              (targetPoints[index].y - startPoint.y) * progress
          }));

          Game.currentProblem.currentPoints = clonePoints(this.points);
          this.proximityState = "snap";
          this.render();

          if (rawProgress < 1) {
            this.snapAnimationFrame = requestAnimationFrame(animate);
            return;
          }

          this.snapAnimationFrame = null;
          this.points = clonePoints(targetPoints);
          Game.currentProblem.currentPoints = clonePoints(targetPoints);
          this.isSnapping = false;
          Game.isSnapping = false;
          this.render();
          Game.evaluateStage(true);
        };

        this.snapAnimationFrame = requestAnimationFrame(animate);
      },

      render() {
        this.svg.replaceChildren();

        const guideGroup = createSvgElement("g");
        const shapeGroup = createSvgElement("g");
        const measureGroup = createSvgElement("g");
        const pointGroup = createSvgElement("g");
        const effectGroup = createSvgElement("g");

        this.drawHints(guideGroup);
        this.drawShape(shapeGroup);
        this.drawMeasurements(measureGroup);
        this.drawPoints(pointGroup);
        this.drawProximityEffect(effectGroup);

        this.svg.append(
          guideGroup,
          shapeGroup,
          measureGroup,
          pointGroup,
          effectGroup
        );
      },

      drawShape(group) {
        const polygonClass =
          this.proximityState === "snap"
            ? "shape-main snap-ready"
            : this.proximityState === "near"
              ? "shape-main near"
              : "shape-main";

        group.appendChild(
          createSvgElement("polygon", {
            points: this.points
              .map((point) => point.x + "," + point.y)
              .join(" "),
            class: polygonClass
          })
        );

        for (let index = 0; index < this.points.length; index += 1) {
          const nextIndex = (index + 1) % this.points.length;
          let className = "shape-side";

          if (this.shouldHighlightSide(index)) {
            className += " highlight";
          } else if (
            this.proximityState === "near" ||
            this.proximityState === "snap"
          ) {
            className += " near";
          }

          group.appendChild(
            createSvgElement("line", {
              x1: this.points[index].x,
              y1: this.points[index].y,
              x2: this.points[nextIndex].x,
              y2: this.points[nextIndex].y,
              class: className
            })
          );
        }

        if (this.currentStage === 3) {
          group.appendChild(
            createSvgElement("line", {
              x1: this.points[0].x,
              y1: this.points[0].y,
              x2: this.points[2].x,
              y2: this.points[2].y,
              class: "diagonal-line"
            })
          );

          group.appendChild(
            createSvgElement("line", {
              x1: this.points[1].x,
              y1: this.points[1].y,
              x2: this.points[3].x,
              y2: this.points[3].y,
              class: "diagonal-line"
            })
          );
        }
      },

      shouldHighlightSide(index) {
        if (this.hintLevel < 1) {
          return false;
        }

        if (
          this.currentStage === 1 &&
          (index === 0 || index === 1)
        ) {
          return true;
        }

        if (
          this.currentStage === 2 &&
          this.hintLevel >= 1
        ) {
          return true;
        }

        return (
          this.currentStage === 3 &&
          this.hintLevel >= 2
        );
      },

      drawHints(group) {
        if (
          this.hintLevel >= 3 &&
          Game.currentProblem
        ) {
          group.appendChild(
            createSvgElement("polygon", {
              points: Game.currentProblem.solutionPoints
                .map((point) => point.x + "," + point.y)
                .join(" "),
              class: "example-shape"
            })
          );
        }

        if (
          this.currentStage === 2 &&
          this.hintLevel >= 2
        ) {
          this.drawParallelGuides(group);
        }

        if (
          this.currentStage === 3 &&
          this.hintLevel >= 1
        ) {
          this.points.forEach((point, index) => {
            const previous =
              this.points[
                (index - 1 + this.points.length) %
                this.points.length
              ];

            const next =
              this.points[(index + 1) % this.points.length];

            const path = this.createRightAnglePath(
              previous,
              point,
              next,
              22
            );

            path.setAttribute("class", "right-angle-hint");
            group.appendChild(path);
          });
        }
      },

      drawParallelGuides(group) {
        [0, 1, 2, 3].forEach((sideIndex) => {
          const start = this.points[sideIndex];
          const end =
            this.points[(sideIndex + 1) % this.points.length];
          const center = midpoint(start, end);
          const direction = normalizeVector(
            createVector(start, end)
          );
          const halfLength = 48;

          group.appendChild(
            createSvgElement("line", {
              x1: center.x - direction.x * halfLength,
              y1: center.y - direction.y * halfLength,
              x2: center.x + direction.x * halfLength,
              y2: center.y + direction.y * halfLength,
              class: "guide-line"
            })
          );
        });
      },

      drawMeasurements(group) {
        const measurements = getMeasurements(this.points);
        const center = getPolygonCenter(this.points);

        this.points.forEach((point, index) => {
          const next =
            this.points[(index + 1) % this.points.length];
          const sideCenter = midpoint(point, next);
          const outward = normalizeVector({
            x: sideCenter.x - center.x,
            y: sideCenter.y - center.y
          });

          const label = createSvgElement("text", {
            x: sideCenter.x + outward.x * 24,
            y: sideCenter.y + outward.y * 24 + 5,
            class: "measure-label"
          });

          label.textContent =
            measurements.lengths[index].toFixed(1);

          group.appendChild(label);
        });

        this.points.forEach((point, index) => {
          const previous =
            this.points[
              (index - 1 + this.points.length) %
              this.points.length
            ];

          const next =
            this.points[(index + 1) % this.points.length];

          const arc = this.createAngleArc(
            previous,
            point,
            next,
            this.currentStage === 1 ? 34 : 30
          );

          if (
            this.currentStage === 1 &&
            this.hintLevel >= 2 &&
            (index === 0 || index === 2)
          ) {
            arc.setAttribute("class", "angle-arc highlight");
          } else {
            arc.setAttribute("class", "angle-arc");
          }

          group.appendChild(arc);

          const inward = normalizeVector({
            x: center.x - point.x,
            y: center.y - point.y
          });

          const label = createSvgElement("text", {
            x: point.x + inward.x * 51,
            y: point.y + inward.y * 51 + 4,
            class: "measure-label"
          });

          label.textContent =
            measurements.angles[index].toFixed(1) + "°";

          group.appendChild(label);

          if (
            this.currentStage === 3 &&
            Math.abs(measurements.angles[index] - 90) <=
              TOLERANCE.angleDegrees
          ) {
            const rightAngle = this.createRightAnglePath(
              previous,
              point,
              next,
              18
            );

            rightAngle.setAttribute("class", "right-angle");
            group.appendChild(rightAngle);
          }
        });
      },

      createAngleArc(pointA, vertex, pointC, radius) {
        const vectorA = normalizeVector(createVector(vertex, pointA));
        const vectorC = normalizeVector(createVector(vertex, pointC));

        const start = {
          x: vertex.x + vectorA.x * radius,
          y: vertex.y + vectorA.y * radius
        };

        const end = {
          x: vertex.x + vectorC.x * radius,
          y: vertex.y + vectorC.y * radius
        };

        const sweepFlag =
          calculateCrossProduct(vectorA, vectorC) > 0 ? 1 : 0;

        return createSvgElement("path", {
          d:
            "M " +
            start.x +
            " " +
            start.y +
            " A " +
            radius +
            " " +
            radius +
            " 0 0 " +
            sweepFlag +
            " " +
            end.x +
            " " +
            end.y
        });
      },

      createRightAnglePath(pointA, vertex, pointC, size) {
        const vectorA = normalizeVector(createVector(vertex, pointA));
        const vectorC = normalizeVector(createVector(vertex, pointC));

        const first = addPoints(
          vertex,
          scaleVector(vectorA, size)
        );

        const corner = addPoints(
          first,
          scaleVector(vectorC, size)
        );

        const second = addPoints(
          vertex,
          scaleVector(vectorC, size)
        );

        return createSvgElement("path", {
          d:
            "M " +
            first.x +
            " " +
            first.y +
            " L " +
            corner.x +
            " " +
            corner.y +
            " L " +
            second.x +
            " " +
            second.y
        });
      },

      drawPoints(group) {
        const center = getPolygonCenter(this.points);
        const locked =
          !Game.isStageActive ||
          Game.isStageCompleted ||
          Game.isTimeOver ||
          this.isSnapping;

        this.points.forEach((point, index) => {
          if (
            this.proximityState === "near" ||
            this.proximityState === "snap"
          ) {
            group.appendChild(
              createSvgElement("circle", {
                cx: point.x,
                cy: point.y,
                r: this.proximityState === "snap" ? 20 : 16,
                class: "point-glow"
              })
            );
          }

          const halo = createSvgElement("circle", {
            cx: point.x,
            cy: point.y,
            r: 29,
            class: locked ? "point-halo locked" : "point-halo",
            tabindex: locked ? -1 : 0,
            role: "button",
            "aria-label": this.labels[index] + " 꼭짓점"
          });

          halo.addEventListener("pointerdown", (event) => {
            this.startDrag(event, index);
          });

          halo.addEventListener("keydown", (event) => {
            if (locked || this.isSnapping) {
              return;
            }

            const step = event.shiftKey ? 10 : 4;
            let changed = true;

            switch (event.key) {
              case "ArrowLeft":
                this.points[index].x -= step;
                break;
              case "ArrowRight":
                this.points[index].x += step;
                break;
              case "ArrowUp":
                this.points[index].y -= step;
                break;
              case "ArrowDown":
                this.points[index].y += step;
                break;
              default:
                changed = false;
            }

            if (!changed) {
              return;
            }

            event.preventDefault();

            this.points[index] = clampPoint(this.points[index]);
            this.lastDraggedIndex = index;
            Game.hasUserInteracted = true;
            Game.currentProblem.currentPoints = clonePoints(this.points);
            this.updateProximityState();
            this.render();
            Game.evaluateStage(false);
          });

          group.appendChild(halo);

          group.appendChild(
            createSvgElement("circle", {
              cx: point.x,
              cy: point.y,
              r: 9,
              class: "vertex-point"
            })
          );

          const outward = normalizeVector({
            x: point.x - center.x,
            y: point.y - center.y
          });

          const label = createSvgElement("text", {
            x: point.x + outward.x * 23,
            y: point.y + outward.y * 23 + 5,
            class: "vertex-label"
          });

          label.textContent = this.labels[index];
          group.appendChild(label);
        });
      },

      drawProximityEffect(group) {
        if (this.proximityState !== "snap") {
          return;
        }

        const center = getPolygonCenter(this.points);

        group.appendChild(
          createSvgElement("circle", {
            cx: center.x,
            cy: center.y,
            r: 24,
            class: "magnet-badge"
          })
        );

        const text = createSvgElement("text", {
          x: center.x,
          y: center.y + 8,
          class: "magnet-text"
        });

        text.textContent = "🧲";
        group.appendChild(text);
      }
    };

    const UI = {
      topStage: document.getElementById("topStage"),
      problemNumber: document.getElementById("problemNumber"),
      timerBox: document.getElementById("timerBox"),
      timeLeft: document.getElementById("timeLeft"),
      totalScore: document.getElementById("totalScore"),
      bestScore: document.getElementById("bestScore"),
      stageScore: document.getElementById("stageScore"),
      stageLabel: document.getElementById("stageLabel"),
      missionTitle: document.getElementById("missionTitle"),
      learningGoal: document.getElementById("learningGoal"),
      conditionList: document.getElementById("conditionList"),
      feedbackMessage: document.getElementById("feedbackMessage"),
      measurementSummary: document.getElementById("measurementSummary"),
      hintText: document.getElementById("hintText"),
      hintBtn: document.getElementById("hintBtn"),
      resetBtn: document.getElementById("resetBtn"),
      newProblemBtn: document.getElementById("newProblemBtn"),
      nextBtn: document.getElementById("nextBtn"),
      completionPanel: document.getElementById("completionPanel"),
      completionTitle: document.getElementById("completionTitle"),
      completionText: document.getElementById("completionText"),
      panelRetryBtn: document.getElementById("panelRetryBtn"),
      panelNewProblemBtn: document.getElementById("panelNewProblemBtn"),
      closeCompletionBtn: document.getElementById("closeCompletionBtn"),
      stageButtons: Array.from(
        document.querySelectorAll(".stage-btn")
      ),

      updateStageInfo(stageNumber, problemNumber) {
        const data = stageData[stageNumber];

        this.topStage.textContent = String(stageNumber);
        this.problemNumber.textContent = String(problemNumber);
        this.stageLabel.textContent =
          "STAGE " + stageNumber + " · 문제 " + problemNumber;
        this.missionTitle.textContent = data.title;
        this.learningGoal.textContent = data.goal;
        this.conditionList.replaceChildren();

        data.conditions.forEach((conditionText, index) => {
          const item = document.createElement("div");
          item.className = "condition-item";
          item.dataset.conditionIndex = String(index);

          const icon = document.createElement("span");
          icon.className = "condition-icon";
          icon.textContent = "·";

          const text = document.createElement("span");
          text.textContent = conditionText;

          item.append(icon, text);
          this.conditionList.appendChild(item);
        });
      },

      updateConditionStates(conditionStates, nearStates) {
        const items = Array.from(
          this.conditionList.querySelectorAll(".condition-item")
        );

        items.forEach((item, index) => {
          const passed = Boolean(conditionStates[index]);
          const near = !passed && Boolean(nearStates[index]);
          const icon = item.querySelector(".condition-icon");

          item.classList.toggle("pass", passed);
          item.classList.toggle("near", near);
          icon.textContent = passed ? "✓" : near ? "≈" : "·";
        });
      },

      updateMeasurements(stageNumber, measurements) {
        const sideNames =
          stageNumber === 1
            ? ["AB", "BC", "CA"]
            : ["AB", "BC", "CD", "DA"];

        const angleNames =
          stageNumber === 1
            ? ["∠A", "∠B", "∠C"]
            : ["∠A", "∠B", "∠C", "∠D"];

        const lengths = sideNames
          .map(
            (name, index) =>
              name + " " + measurements.lengths[index].toFixed(1)
          )
          .join(" · ");

        const angles = angleNames
          .map(
            (name, index) =>
              name + " " + measurements.angles[index].toFixed(1) + "°"
          )
          .join(" · ");

        let summary = lengths + "<br>" + angles;

        if (stageNumber === 3) {
          summary +=
            "<br>대각선 AC " +
            measurements.diagonals[0].toFixed(1) +
            " · BD " +
            measurements.diagonals[1].toFixed(1);
        }

        if (measurements.selfIntersecting) {
          summary +=
            '<br><span style="color:var(--danger)">주의: 도형이 자기 교차하고 있습니다.</span>';
        }

        this.measurementSummary.innerHTML = summary;
      },

      updateTimer(seconds) {
        this.timeLeft.textContent = seconds + "초";
        this.timerBox.classList.toggle(
          "timer-warning",
          seconds <= 10 && seconds > 5
        );
        this.timerBox.classList.toggle(
          "timer-danger",
          seconds <= 5
        );
      },

      updateStageButtons(activeStage, completedStages) {
        this.stageButtons.forEach((button) => {
          const stageNumber = Number(button.dataset.stage);

          button.classList.toggle(
            "active",
            stageNumber === activeStage
          );

          button.classList.toggle(
            "completed",
            completedStages.has(stageNumber)
          );
        });
      },

      showCompletion(score, remainingSeconds) {
        this.completionPanel.classList.remove("failure");
        this.completionTitle.textContent = "복원 완료!";
        this.completionText.textContent =
          "기본 점수와 시간 보너스를 합쳐 " +
          score +
          "점을 획득했습니다. 남은 시간은 " +
          remainingSeconds +
          "초입니다.";

        this.panelRetryBtn.hidden = true;
        this.panelNewProblemBtn.textContent = "다음 랜덤 문제";
        this.closeCompletionBtn.hidden = false;
        this.completionPanel.hidden = false;
      },

      showFailure() {
        this.completionPanel.classList.add("failure");
        this.completionTitle.textContent = "시간 종료";
        this.completionText.textContent =
          "제한 시간이 끝났습니다. 같은 문제를 다시 도전하거나 새 문제를 시작하세요.";

        this.panelRetryBtn.hidden = false;
        this.panelNewProblemBtn.textContent = "새 문제";
        this.closeCompletionBtn.hidden = true;
        this.completionPanel.hidden = false;
      },

      hideCompletion() {
        this.completionPanel.hidden = true;
      }
    };

    const Game = {
      currentStage: 1,
      currentProblem: null,
      problemCounts: {
        1: 0,
        2: 0,
        3: 0
      },
      totalScore: 0,
      bestScore: 0,
      completedStages: new Set(),
      completedProblemIds: new Set(),
      recentProblemFeatures: {
        1: [],
        2: [],
        3: []
      },
      timerIntervalId: null,
      remainingSeconds: 40,
      stageStartTime: 0,
      hasUserInteracted: false,
      isStageActive: false,
      isStageCompleted: false,
      isTimeOver: false,
      isSnapping: false,

      initialize() {
        this.loadStorage();
        GeometryEngine.initialize();
        this.bindEvents();
        this.switchStage(1);
        this.updateScoreDisplay();
      },

      loadStorage() {
        const storedBest = Number(
          localStorage.getItem(STORAGE_KEYS.bestScore)
        );

        this.bestScore = Number.isFinite(storedBest)
          ? storedBest
          : 0;

        try {
          const storedStages = JSON.parse(
            localStorage.getItem(
              STORAGE_KEYS.completedStages
            ) || "[]"
          );

          if (Array.isArray(storedStages)) {
            this.completedStages = new Set(
              storedStages
                .map(Number)
                .filter((stageNumber) =>
                  [1, 2, 3].includes(stageNumber)
                )
            );
          }
        } catch (error) {
          this.completedStages = new Set();
        }
      },

      saveStorage() {
        localStorage.setItem(
          STORAGE_KEYS.bestScore,
          String(this.bestScore)
        );

        localStorage.setItem(
          STORAGE_KEYS.completedStages,
          JSON.stringify(
            Array.from(this.completedStages).sort()
          )
        );
      },

      bindEvents() {
        UI.stageButtons.forEach((button) => {
          button.addEventListener("click", () => {
            this.switchStage(Number(button.dataset.stage));
          });
        });

        UI.hintBtn.addEventListener("click", () => {
          this.useHint();
        });

        UI.resetBtn.addEventListener("click", () => {
          this.resetCurrentProblem();
        });

        UI.newProblemBtn.addEventListener("click", () => {
          this.startNewProblem();
        });

        UI.nextBtn.addEventListener("click", () => {
          const nextStage =
            this.currentStage === 3
              ? 1
              : this.currentStage + 1;

          this.switchStage(nextStage);
        });

        UI.panelRetryBtn.addEventListener("click", () => {
          this.resetCurrentProblem();
        });

        UI.panelNewProblemBtn.addEventListener("click", () => {
          this.startNewProblem();
        });

        UI.closeCompletionBtn.addEventListener("click", () => {
          UI.hideCompletion();
        });
      },

      switchStage(stageNumber) {
        this.stopTimer();
        GeometryEngine.cancelSnapAnimation();

        this.currentStage = stageNumber;
        this.startNewProblem();
      },

      startNewProblem() {
        this.stopTimer();
        GeometryEngine.cancelSnapAnimation();
        UI.hideCompletion();

        const problem = generateStageProblem(this.currentStage);

        this.problemCounts[this.currentStage] += 1;
        this.currentProblem = problem;

        const recent =
          this.recentProblemFeatures[this.currentStage];

        recent.push({
          ...problem.features,
          brokenIndices: [...problem.features.brokenIndices]
        });

        if (recent.length > 5) {
          recent.shift();
        }

        this.prepareProblemState();
      },

      resetCurrentProblem() {
        if (!this.currentProblem) {
          return;
        }

        this.stopTimer();
        GeometryEngine.cancelSnapAnimation();
        UI.hideCompletion();

        this.currentProblem.currentPoints = clonePoints(
          this.currentProblem.initialPoints
        );

        this.currentProblem.hintCount = 0;
        this.currentProblem.startTime = Date.now();
        this.currentProblem.completed = false;

        this.prepareProblemState(false);
      },

      prepareProblemState(updateProblemNumber = true) {
        this.hasUserInteracted = false;
        this.isStageActive = true;
        this.isStageCompleted = false;
        this.isTimeOver = false;
        this.isSnapping = false;
        this.stageStartTime = Date.now();
        this.currentProblem.startTime = this.stageStartTime;
        this.remainingSeconds = TIME_LIMITS[this.currentStage];

        GeometryEngine.setProblem(this.currentProblem);

        UI.updateStageInfo(
          this.currentStage,
          this.problemCounts[this.currentStage]
        );

        UI.updateStageButtons(
          this.currentStage,
          this.completedStages
        );

        UI.stageScore.textContent = String(
          100 - this.currentProblem.hintCount * 20
        );

        UI.hintText.textContent =
          "아직 힌트를 사용하지 않았습니다.";

        UI.hintBtn.disabled = false;
        UI.hintBtn.textContent = "힌트 보기 (0/3)";
        UI.resetBtn.disabled = false;
        UI.newProblemBtn.disabled = false;

        UI.nextBtn.textContent =
          this.currentStage === 3
            ? "Stage 1로 이동"
            : "다음 Stage";

        UI.feedbackMessage.textContent =
          "아직 멀었습니다. 꼭짓점을 움직여 도형의 성질을 맞춰 보세요.";

        UI.updateTimer(this.remainingSeconds);
        this.evaluateStage(false);
        this.startTimer();

        void updateProblemNumber;
      },

      startTimer() {
        this.stopTimer();

        this.timerIntervalId = window.setInterval(() => {
          if (
            !this.isStageActive ||
            this.isStageCompleted ||
            this.isTimeOver
          ) {
            return;
          }

          const elapsed =
            (Date.now() - this.stageStartTime) / 1000;

          const nextRemaining = Math.max(
            0,
            Math.ceil(
              TIME_LIMITS[this.currentStage] - elapsed
            )
          );

          if (nextRemaining !== this.remainingSeconds) {
            this.remainingSeconds = nextRemaining;
            UI.updateTimer(this.remainingSeconds);
          }

          if (this.remainingSeconds <= 0) {
            this.handleTimeOver();
          }
        }, 200);
      },

      stopTimer() {
        if (this.timerIntervalId !== null) {
          clearInterval(this.timerIntervalId);
          this.timerIntervalId = null;
        }
      },

      handleTimeOver() {
        if (
          this.isTimeOver ||
          this.isStageCompleted
        ) {
          return;
        }

        this.stopTimer();
        GeometryEngine.cancelSnapAnimation();

        this.remainingSeconds = 0;
        this.isTimeOver = true;
        this.isStageActive = false;
        this.isSnapping = false;

        UI.updateTimer(0);
        UI.feedbackMessage.innerHTML =
          '<span style="color:var(--danger);font-weight:900">시간 종료</span>';

        GeometryEngine.render();
        UI.showFailure();
      },

      useHint() {
        if (
          !this.currentProblem ||
          this.currentProblem.hintCount >= 3 ||
          this.isTimeOver ||
          this.isStageCompleted
        ) {
          return;
        }

        this.currentProblem.hintCount += 1;
        GeometryEngine.hintLevel =
          this.currentProblem.hintCount;
        GeometryEngine.render();

        const baseScore = Math.max(
          40,
          100 - this.currentProblem.hintCount * 20
        );

        UI.stageScore.textContent = String(baseScore);
        UI.hintText.textContent =
          stageData[this.currentStage].hints[
            this.currentProblem.hintCount - 1
          ];

        UI.hintBtn.textContent =
          this.currentProblem.hintCount >= 3
            ? "힌트 모두 사용"
            : "힌트 보기 (" +
              this.currentProblem.hintCount +
              "/3)";

        UI.hintBtn.disabled =
          this.currentProblem.hintCount >= 3;

        UI.feedbackMessage.textContent =
          "힌트를 사용해 기본 점수에서 20점이 감점되었습니다.";
      },

      evaluateStage(fromSnap) {
        if (!this.currentProblem) {
          return;
        }

        const snapState = calculateSnapState(
          GeometryEngine.points,
          this.currentStage
        );

        UI.updateConditionStates(
          snapState.success.conditions,
          snapState.near.conditions
        );

        UI.updateMeasurements(
          this.currentStage,
          snapState.success.measurements
        );

        if (
          this.isTimeOver ||
          this.isStageCompleted ||
          !this.isStageActive ||
          this.isSnapping ||
          GeometryEngine.isSnapping
        ) {
          return;
        }

        const protectedTime =
          Date.now() - this.stageStartTime < 500;

        const allSolved =
          snapState.success.conditions.every(Boolean);

        if (
          allSolved &&
          this.hasUserInteracted &&
          !protectedTime
        ) {
          if (fromSnap || GeometryEngine.activePointIndex === null) {
            this.completeCurrentProblem();
          }

          return;
        }

        if (snapState.isSnapReady) {
          UI.feedbackMessage.innerHTML =
            '<span style="color:var(--primary);font-weight:900">🧲 자석 스냅 가능 상태입니다. 꼭짓점을 놓아 보세요.</span>';
          return;
        }

        if (snapState.isNear) {
          UI.feedbackMessage.innerHTML =
            '<span style="color:var(--warning);font-weight:800">거의 맞았습니다. 조금만 더 조절해 보세요.</span>';
          return;
        }

        if (snapState.hasOneNearCondition) {
          UI.feedbackMessage.textContent =
            "조건 하나가 가까워지고 있습니다.";
          return;
        }

        if (snapState.success.measurements.selfIntersecting) {
          UI.feedbackMessage.innerHTML =
            '<span style="color:var(--danger);font-weight:800">변이 서로 교차하지 않도록 꼭짓점을 조절하세요.</span>';
          return;
        }

        UI.feedbackMessage.textContent =
          "아직 멀었습니다. 조건 표시를 보며 도형을 조절하세요.";
      },

      completeCurrentProblem() {
        if (
          this.isStageCompleted ||
          this.isTimeOver ||
          !this.isStageActive ||
          !this.hasUserInteracted ||
          Date.now() - this.stageStartTime < 500
        ) {
          return;
        }

        if (
          !isStageSolved(
            GeometryEngine.points,
            this.currentStage
          )
        ) {
          return;
        }

        this.isStageCompleted = true;
        this.isStageActive = false;
        this.currentProblem.completed = true;
        this.currentProblem.currentPoints =
          clonePoints(GeometryEngine.points);

        this.stopTimer();

        const baseScore = Math.max(
          40,
          100 - this.currentProblem.hintCount * 20
        );

        const timeBonus = this.remainingSeconds * 2;
        const awardedScore = baseScore + timeBonus;

        if (
          !this.completedProblemIds.has(
            this.currentProblem.id
          )
        ) {
          this.completedProblemIds.add(
            this.currentProblem.id
          );

          this.totalScore += awardedScore;
          this.completedStages.add(this.currentStage);

          if (this.totalScore > this.bestScore) {
            this.bestScore = this.totalScore;
          }

          this.saveStorage();
          this.updateScoreDisplay();

          UI.updateStageButtons(
            this.currentStage,
            this.completedStages
          );
        }

        UI.feedbackMessage.innerHTML =
          '<span style="color:var(--success);font-weight:900">복원 완료</span>';

        GeometryEngine.render();
        UI.showCompletion(
          awardedScore,
          this.remainingSeconds
        );
      },

      updateScoreDisplay() {
        UI.totalScore.textContent =
          String(this.totalScore);
        UI.bestScore.textContent =
          String(this.bestScore);
      }
    };

    Game.initialize();
  </script>
</body>
</html>
